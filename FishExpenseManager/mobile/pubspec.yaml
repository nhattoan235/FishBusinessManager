name: fish_business_manager
description: "Phần mềm quản lý kinh doanh chứng nước offline-first cho hộ gia đình"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  
  # Offline Database (Drift + SQLite)
  drift: ^2.20.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0
  logger: ^2.4.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: 2.4.15
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
